// Compiled in CI. Build with: ./gradlew -PwithNeoForge :neoforge:build
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

base { archivesName = 'herobrine-api' }

repositories {
    maven { url = 'https://maven-central.storage-download.googleapis.com/maven2' }
    mavenCentral()
    // EngineHub's repository, for WorldEdit's own artifacts only (see the test dependency below).
    exclusiveContent {
        forRepository { maven { url = 'https://maven.enginehub.org/repo/' } }
        filter { includeGroupByRegex 'com\\.sk89q(\\..*)?' }
    }
}

neoForge {
    version = '21.1.172'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        // Dev runs (runClient/runServer) load each mod from its own classloader, keyed off these
        // sourceSets; without core's, GameThread/ApiServer/etc. are NoClassDefFoundError at runtime
        // there even though the built jar already bundles them (see the jar{} block below).
        herobrine_api {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
}

dependencies {
    implementation project(':core')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    // The real WorldEdit 7.3.8 for NeoForge, on the test runtime classpath only: WorldEditProvenanceTest
    // resolves every WorldEdit class, method, constructor and field the adapter reaches by reflection against
    // it. The mod itself never compiles against or bundles WorldEdit; it stays an optional runtime mod.
    testRuntimeOnly 'com.sk89q.worldedit:worldedit-neoforge-mc1.21:7.3.8'
}

// ApiController (like the rest of main) touches Mojang/NeoForge logging classes that only live on
// the modded game's compile/runtime classpath, not on the plain JUnit classpath the 'java' plugin
// gives the 'test' source set by default -- so tests see it too.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

test { useJUnitPlatform() }

// Bundle core classes into the mod jar (Gson is provided by Minecraft at runtime).
jar {
    dependsOn ':core:classes'
    from project(':core').sourceSets.main.output
}
